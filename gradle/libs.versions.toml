[versions]
agp = "9.1.1"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
androidx-activity = "1.13.0"
androidx-appcompat = "1.8.0"
androidx-core = "1.19.1"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.10.0-rc01"
androidx-testExt = "1.3.0"
coil = "3.6.3"
# Install attribution and the identifiers `users/add` registers a device under. Play Services and
# the Install Referrer client are Android-only by nature; the iOS side of that call reads UIKit and
# AdSupport instead, which need no declaration here.
installReferrer = "2.2"
# Pinned to exactly what firebase-bom 33.15.0 (tpFirebaseBom, below) resolves these four to. The
# shared module cannot use the BOM itself — `platform()` is not available inside a Kotlin
# Multiplatform source set's dependency block — so the versions are written out instead. Bump
# tpFirebaseBom and these together, or the app module and the shared module drift apart.
firebaseAnalytics = "22.4.0"
firebaseCrashlytics = "19.4.4"
firebaseInstallations = "18.0.0"
firebaseMessaging = "24.1.1"
playServicesAdsIdentifier = "18.2.0"
playServicesAppSet = "16.1.0"
# Versions below are the ones the Travelpayouts SDK is built and shipped against; the .aar has no
# POM, so these are pinned by hand rather than resolved.
tpAdapterDelegates = "4.3.2"
tpAppodeal = "3.7.0"
tpAppsFlyer = "6.17.0"
tpCoil2 = "2.7.0"
tpCrunchyCalendar = "2.6.1"
tpDagger = "2.56.2"
tpNavigation = "2.9.0"
tpDesugarJdkLibs = "2.1.5"
tpFirebaseBom = "33.15.0"
tpFlowBinding = "1.2.0"
tpGson = "2.11.0"
tpInsetter = "0.6.1"
tpLottie = "6.6.2"
tpMaterial = "1.12.0"
tpOkhttpBom = "4.10.0"
tpPlayServicesLocation = "21.3.0"
tpPlayServicesMaps = "19.2.0"
tpReview = "2.0.2"
tpRetrofit = "2.11.0"
tpSkeletonLayout = "4.0.0"
tpTimber = "5.0.1"
tpViewBindingDelegate = "1.5.9"
composeMultiplatform = "1.12.1"
# Reads androidApp/google-services.json and turns it into the resources Firebase's startup
# provider reads. Without this plugin the file is inert — it is not picked up by AGP alone.
googleServices = "4.4.3"
# Uploads the mapping file and the native symbols a release crash has to be read through, and
# stamps each build with the id Crashlytics matches a report against. The `firebase-crashlytics`
# library below reports without it; the reports just arrive obfuscated and unattributed to a build.
firebaseCrashlyticsPlugin = "3.0.8"
junit = "4.13.2"
kotlin = "2.4.20"
kotlinx-coroutines = "1.10.2"
kotlinx-serialization = "1.9.0"
ktor = "3.4.3"
material3 = "1.12.0-alpha03"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
compose-uiTooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
install-referrer = { module = "com.android.installreferrer:installreferrer", version.ref = "installReferrer" }
play-services-ads-identifier = { module = "com.google.android.gms:play-services-ads-identifier", version.ref = "playServicesAdsIdentifier" }
play-services-appset = { module = "com.google.android.gms:play-services-appset", version.ref = "playServicesAppSet" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics", version.ref = "firebaseAnalytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics", version.ref = "firebaseCrashlytics" }
firebase-installations = { module = "com.google.firebase:firebase-installations", version.ref = "firebaseInstallations" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebaseMessaging" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
# --- Travelpayouts SDK runtime dependencies -------------------------------------------------
# Derived from the classes the .aar actually references (jdeps over its classes.jar), so this is
# what it needs rather than everything the reference app happens to declare.
tp-adapterdelegates4 = { module = "com.hannesdorfmann:adapterdelegates4", version.ref = "tpAdapterDelegates" }
tp-adapterdelegates4-dsl = { module = "com.hannesdorfmann:adapterdelegates4-kotlin-dsl", version.ref = "tpAdapterDelegates" }
tp-adapterdelegates4-dsl-layoutcontainer = { module = "com.hannesdorfmann:adapterdelegates4-kotlin-dsl-layoutcontainer", version.ref = "tpAdapterDelegates" }
tp-adapterdelegates4-dsl-viewbinding = { module = "com.hannesdorfmann:adapterdelegates4-kotlin-dsl-viewbinding", version.ref = "tpAdapterDelegates" }
tp-appodeal-core = { module = "com.appodeal.ads.sdk:core", version.ref = "tpAppodeal" }
tp-appsflyer = { module = "com.appsflyer:af-android-sdk", version.ref = "tpAppsFlyer" }
tp-coil = { module = "io.coil-kt:coil", version.ref = "tpCoil2" }
tp-coil-base = { module = "io.coil-kt:coil-base", version.ref = "tpCoil2" }
tp-coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "tpCoil2" }
tp-crunchycalendar = { module = "ru.cleverpumpkin:crunchycalendar", version.ref = "tpCrunchyCalendar" }
tp-dagger = { module = "com.google.dagger:dagger", version.ref = "tpDagger" }
tp-desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "tpDesugarJdkLibs" }
tp-firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "tpFirebaseBom" }
tp-firebase-analytics = { module = "com.google.firebase:firebase-analytics-ktx" }
tp-firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
tp-flowbinding-android = { module = "io.github.reactivecircus.flowbinding:flowbinding-android", version.ref = "tpFlowBinding" }
tp-flowbinding-core = { module = "io.github.reactivecircus.flowbinding:flowbinding-core", version.ref = "tpFlowBinding" }
tp-flowbinding-material = { module = "io.github.reactivecircus.flowbinding:flowbinding-material", version.ref = "tpFlowBinding" }
tp-flowbinding-recyclerview = { module = "io.github.reactivecircus.flowbinding:flowbinding-recyclerview", version.ref = "tpFlowBinding" }
tp-gson = { module = "com.google.code.gson:gson", version.ref = "tpGson" }
tp-insetter = { module = "dev.chrisbanes.insetter:insetter", version.ref = "tpInsetter" }
tp-lottie = { module = "com.airbnb.android:lottie", version.ref = "tpLottie" }
tp-material = { module = "com.google.android.material:material", version.ref = "tpMaterial" }
tp-navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "tpNavigation" }
tp-navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "tpNavigation" }
tp-okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "tpOkhttpBom" }
tp-okhttp = { module = "com.squareup.okhttp3:okhttp" }
tp-okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor" }
tp-play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "tpPlayServicesLocation" }
tp-play-services-maps = { module = "com.google.android.gms:play-services-maps", version.ref = "tpPlayServicesMaps" }
tp-review = { module = "com.google.android.play:review", version.ref = "tpReview" }
tp-review-ktx = { module = "com.google.android.play:review-ktx", version.ref = "tpReview" }
tp-retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "tpRetrofit" }
tp-retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "tpRetrofit" }
tp-retrofit-converter-scalars = { module = "com.squareup.retrofit2:converter-scalars", version.ref = "tpRetrofit" }
tp-skeletonlayout = { module = "com.faltenreich:skeletonlayout", version.ref = "tpSkeletonLayout" }
tp-timber = { module = "com.jakewharton.timber:timber", version.ref = "tpTimber" }
tp-viewbindingdelegate = { module = "com.github.kirich1409:viewbindingpropertydelegate-noreflection", version.ref = "tpViewBindingDelegate" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-uiToolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebaseCrashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }